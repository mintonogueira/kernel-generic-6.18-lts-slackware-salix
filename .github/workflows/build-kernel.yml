name: Build Slackware Kernel 6.18 TXZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-kernel.yml"
      - ".github/scripts/build-kernel-slackware.sh"

permissions:
  contents: write

concurrency:
  group: kernel-6.18-slackware
  cancel-in-progress: true

env:
  JOBS: "2"
  SLACKWARE_IMAGE: "aclemons/slackware:15.0"

jobs:
  build:
    name: Compilar e empacotar no Slackware 15.0
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      kernel_version: ${{ steps.meta.outputs.kernel_version }}
      package_name: ${{ steps.meta.outputs.package_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Liberar espaço no runner
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Antes da limpeza ==="
          df -h /

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker system prune -af --volumes || true

          echo "=== Depois da limpeza ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar script de build
        shell: bash
        run: |
          set -euxo pipefail
          bash -n .github/scripts/build-kernel-slackware.sh
          chmod +x .github/scripts/build-kernel-slackware.sh

      - name: Baixar imagem base Slackware 15.0
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform linux/amd64 "$SLACKWARE_IMAGE"
          docker image inspect "$SLACKWARE_IMAGE" >/dev/null
          docker images "$SLACKWARE_IMAGE"
          df -h /

      - name: Compilar kernel e criar pacote TXZ
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf output .kernel-build
          mkdir -p output .kernel-build

          # O toolchain é instalado dentro do Slackware 15.0. A árvore pesada
          # do kernel fica no bind mount /work/.kernel-build, e não na camada
          # gravável do Docker.
          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            -e JOBS="$JOBS" \
            -e WORKROOT=/work \
            -e BUILDROOT=/work/.kernel-build \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$SLACKWARE_IMAGE" \
            /bin/bash /work/.github/scripts/build-kernel-slackware.sh

      - name: Registrar diagnóstico da falha
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .ci

          {
            echo "GitHub Actions - último diagnóstico de falha"
            echo "==========================================="
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "image=$SLACKWARE_IMAGE"
            echo "jobs=$JOBS"
            echo
            echo "Espaço em disco:"
            df -h /
            echo
            echo "Uso da árvore de build:"
            du -sh .kernel-build 2>/dev/null || true
            echo

            if [ -s output/build.log ]; then
              echo "Últimas 2500 linhas de output/build.log:"
              echo "-----------------------------------------"
              tail -n 2500 output/build.log
            else
              echo "output/build.log não foi criado."
              echo "A falha ocorreu antes de o script de build iniciar."
            fi
          } > .ci/last-failure.log

          cat .ci/last-failure.log | tail -n 250

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-failure.log

          if ! git diff --cached --quiet; then
            git commit -m "CI: registra última falha do build do kernel"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload do log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-log
          path: |
            output/build.log
            output/meta.env
            .ci/last-failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Ler metadados do pacote
        id: meta
        shell: bash
        run: |
          set -euxo pipefail
          test -s output/meta.env
          source output/meta.env
          test -n "$KERNEL_VERSION"
          test -n "$PACKAGE_NAME"
          test -n "$RELEASE_TAG"
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cat output/meta.env

      - name: Verificar artefatos
        shell: bash
        run: |
          set -euxo pipefail
          source output/meta.env
          test -s "output/$PACKAGE_NAME"
          test -s "output/$PACKAGE_NAME.sha256"
          test -s "output/config-$KERNEL_VERSION.final"
          (
            cd output
            sha256sum -c "$PACKAGE_NAME.sha256"
          )
          ls -lh output/
          df -h /

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: kernel-slackware-${{ steps.meta.outputs.kernel_version }}
          path: |
            output/${{ steps.meta.outputs.package_name }}
            output/${{ steps.meta.outputs.package_name }}.sha256
            output/config-${{ steps.meta.outputs.kernel_version }}.final
            output/build.log
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publicar TXZ
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar pacote
        uses: actions/download-artifact@v4
        with:
          name: kernel-slackware-${{ needs.build.outputs.kernel_version }}
          path: release

      - name: Publicar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.kernel_version }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
        run: |
          set -euxo pipefail
          ls -lh release/

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" \
              "release/$PACKAGE" \
              "release/$PACKAGE.sha256" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "release/$PACKAGE" \
              "release/$PACKAGE.sha256" \
              --title "Linux $VERSION para Slackware/Salix" \
              --notes "Pacote TXZ x86_64 compilado dentro de Slackware 15.0 e criado com o makepkg nativo do Slackware. Inclui kernel e módulos correspondentes. XFS, Btrfs, SATA/AHCI, device-mapper e dm-crypt são built-in. Instalação: sudo installpkg $PACKAGE"
          fi
