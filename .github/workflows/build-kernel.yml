name: Build Slackware Kernel 6.18 TXZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-kernel.yml"

permissions:
  contents: write

env:
  JOBS: "2"

jobs:
  build:
    name: Build no Slackware 15.0
    runs-on: ubuntu-latest
    timeout-minutes: 300

    container:
      image: aclemons/slackware:15.0

    defaults:
      run:
        shell: bash

    outputs:
      kernel_version: ${{ steps.version.outputs.kernel_version }}
      package_name: ${{ steps.version.outputs.package_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Confirmar ambiente Slackware
        run: |
          set -euo pipefail
          echo "=== /etc/slackware-version ==="
          cat /etc/slackware-version
          echo
          echo "=== uname ==="
          uname -a
          echo
          echo "=== pkgtools ==="
          command -v installpkg
          command -v upgradepkg
          command -v makepkg

      - name: Instalar toolchain do Slackware
        run: |
          set -euo pipefail
          SLACKPKG="slackpkg -batch=on -default_answer=y -orig_backups=off"
          $SLACKPKG update
          $SLACKPKG install \
            ca-certificates \
            wget \
            git \
            gcc \
            binutils \
            make \
            bc \
            bison \
            flex \
            perl \
            openssl \
            openssl-solibs \
            elfutils \
            gmp \
            mpfr \
            libmpc \
            guile \
            gc \
            libunistring \
            zlib \
            bzip2 \
            xz \
            zstd \
            kmod \
            cpio \
            rsync \
            patch \
            diffutils \
            file \
            which \
            pkgtools
          update-ca-certificates || true
          echo
          echo "=== Toolchain ==="
          gcc --version | head -1
          ld --version | head -1
          make --version | head -1
          command -v makepkg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Detectar Linux 6.18.x mais recente
        id: version
        run: |
          set -euo pipefail
          INDEX="$(wget -qO- https://cdn.kernel.org/pub/linux/kernel/v6.x/)"
          VERSION="$(printf '%s\n' "$INDEX" \
            | grep -oE 'linux-6\.18\.[0-9]+\.tar\.xz' \
            | sed -e 's/^linux-//' -e 's/\.tar\.xz$//' \
            | sort -Vu \
            | tail -1)"
          test -n "$VERSION"
          PACKAGE_NAME="kernel-generic-lts618-${VERSION}-x86_64-1_custom.txz"
          RELEASE_TAG="kernel-${VERSION}"
          echo "kernel_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "KERNEL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Kernel selecionado: $VERSION"
          echo "Pacote: $PACKAGE_NAME"

      - name: Baixar e verificar kernel
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/download"
          cd "$GITHUB_WORKSPACE/build/download"
          TARBALL="linux-${KERNEL_VERSION}.tar.xz"
          wget "https://cdn.kernel.org/pub/linux/kernel/v6.x/${TARBALL}"
          wget "https://cdn.kernel.org/pub/linux/kernel/v6.x/sha256sums.asc"
          EXPECTED="$(awk -v file="$TARBALL" '$2 == file { print $1; exit }' sha256sums.asc)"
          test -n "$EXPECTED"
          printf '%s  %s\n' "$EXPECTED" "$TARBALL" | sha256sum -c -
          cd "$GITHUB_WORKSPACE/build"
          tar -xJf "download/${TARBALL}"

      - name: Obter configuração Slackware x86_64
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/linux-${KERNEL_VERSION}"
          wget -O .config \
            "https://mirrors.slackware.com/slackware/slackware64-current/source/k612/kernel-configs/config-6.12.103.x64"
          test -s .config
          echo "Configuração Slackware obtida:"
          wc -l .config

      - name: Adaptar configuração para Linux 6.18
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/linux-${KERNEL_VERSION}"
          make olddefconfig
          CFG="./scripts/config"
          "$CFG" --set-str LOCALVERSION ""
          "$CFG" --disable LOCALVERSION_AUTO
          "$CFG" --enable MODULES
          "$CFG" --enable MODULE_UNLOAD
          "$CFG" --disable MODVERSIONS
          "$CFG" --disable MODULE_SIG
          "$CFG" --disable MODULE_SIG_ALL
          "$CFG" --set-str SYSTEM_TRUSTED_KEYS ""
          "$CFG" --set-str SYSTEM_REVOCATION_KEYS ""
          "$CFG" --disable DEBUG_INFO
          "$CFG" --disable DEBUG_INFO_BTF || true
          "$CFG" --disable RUST || true
          "$CFG" --disable LTO || true
          "$CFG" --enable LTO_NONE || true
          "$CFG" --enable BLK_DEV_INITRD
          "$CFG" --enable DEVTMPFS
          "$CFG" --enable DEVTMPFS_MOUNT
          "$CFG" --enable TMPFS
          "$CFG" --enable EFI
          "$CFG" --enable EFI_STUB
          "$CFG" --enable EFIVAR_FS
          "$CFG" --enable EFI_PARTITION
          "$CFG" --enable SCSI
          "$CFG" --enable BLK_DEV_SD
          "$CFG" --enable ATA
          "$CFG" --enable SATA_AHCI
          "$CFG" --enable NVME_CORE
          "$CFG" --enable BLK_DEV_NVME
          "$CFG" --enable BLK_DEV_DM
          "$CFG" --enable DM_CRYPT
          "$CFG" --enable XFS_FS
          "$CFG" --enable BTRFS_FS
          "$CFG" --enable EXT4_FS
          "$CFG" --enable FAT_FS
          "$CFG" --enable VFAT_FS
          "$CFG" --enable ZSTD_COMPRESS
          "$CFG" --enable ZSTD_DECOMPRESS
          "$CFG" --enable CRYPTO
          "$CFG" --enable CRYPTO_AES
          "$CFG" --enable CRYPTO_XTS
          "$CFG" --enable CRYPTO_SHA256
          "$CFG" --enable CRYPTO_SHA512
          make olddefconfig
          cp .config "$GITHUB_WORKSPACE/build/config-${KERNEL_VERSION}.final"

      - name: Validar configuração crítica
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/linux-${KERNEL_VERSION}"
          REQUIRE_Y=(
            MODULES
            DEVTMPFS
            SCSI
            BLK_DEV_SD
            ATA
            SATA_AHCI
            BLK_DEV_DM
            DM_CRYPT
            XFS_FS
            BTRFS_FS
            EXT4_FS
            EFI
            EFI_STUB
            ZSTD_COMPRESS
            ZSTD_DECOMPRESS
          )
          for SYMBOL in "${REQUIRE_Y[@]}"; do
            if ! grep -q "^CONFIG_${SYMBOL}=y$" .config; then
              echo "CONFIG_${SYMBOL} não ficou =y"
              exit 1
            fi
          done
          grep -E '^CONFIG_(MODULES|MODVERSIONS|SCSI|BLK_DEV_SD|ATA|SATA_AHCI|BLK_DEV_DM|DM_CRYPT|XFS_FS|BTRFS_FS|EXT4_FS|EFI|EFI_STUB|ZSTD_COMPRESS|ZSTD_DECOMPRESS)=' .config
          RELEASE="$(make -s kernelrelease)"
          test "$RELEASE" = "$KERNEL_VERSION"
          echo "Kernel release: $RELEASE"

      - name: Compilar kernel e módulos no Slackware
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/linux-${KERNEL_VERSION}"
          echo "Compilando com ${JOBS} jobs"
          make -j"${JOBS}" bzImage modules
          test -s arch/x86/boot/bzImage
          test -s System.map
          ls -lh arch/x86/boot/bzImage System.map

      - name: Montar árvore do pacote Slackware
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/linux-${KERNEL_VERSION}"
          RELEASE="$(make -s kernelrelease)"
          PKGROOT="$GITHUB_WORKSPACE/build/package-root"
          rm -rf "$PKGROOT"
          mkdir -p \
            "$PKGROOT/boot" \
            "$PKGROOT/lib/modules" \
            "$PKGROOT/usr/doc/kernel-generic-lts618-${RELEASE}" \
            "$PKGROOT/install"
          cp arch/x86/boot/bzImage "$PKGROOT/boot/vmlinuz-${RELEASE}"
          cp System.map "$PKGROOT/boot/System.map-${RELEASE}"
          cp .config "$PKGROOT/boot/config-${RELEASE}"
          make modules_install INSTALL_MOD_PATH="$PKGROOT" INSTALL_MOD_STRIP=1
          rm -f \
            "$PKGROOT/lib/modules/${RELEASE}/build" \
            "$PKGROOT/lib/modules/${RELEASE}/source"
          cat > "$PKGROOT/usr/doc/kernel-generic-lts618-${RELEASE}/README" <<EOF
Linux ${RELEASE}

Pacote customizado para Slackware/Salix x86_64.
Compilado dentro de Slackware 15.0.

Inclui:
  /boot/vmlinuz-${RELEASE}
  /boot/System.map-${RELEASE}
  /boot/config-${RELEASE}
  /lib/modules/${RELEASE}/

XFS, Btrfs, Zstd, SATA/AHCI e suporte essencial de armazenamento foram
compilados diretamente no kernel.

Este pacote NÃO substitui automaticamente o kernel antigo e NÃO altera
GRUB, ELILO, LILO ou systemd-boot.
EOF
          cat > "$PKGROOT/install/slack-desc" <<EOF
kernel-generic-lts618: kernel-generic-lts618 (Linux ${RELEASE} LTS)
kernel-generic-lts618:
kernel-generic-lts618: Kernel Linux ${RELEASE} x86_64 compilado em Slackware 15.0.
kernel-generic-lts618: Destinado a sistemas Slackware e Salix.
kernel-generic-lts618: Inclui o kernel e seus módulos correspondentes.
kernel-generic-lts618: XFS e Btrfs são compilados diretamente no kernel.
kernel-generic-lts618: Zstd também é incorporado para suporte confiável ao Btrfs.
kernel-generic-lts618: Os arquivos de boot usam nomes versionados.
kernel-generic-lts618: O pacote não remove kernels anteriormente instalados.
kernel-generic-lts618:
kernel-generic-lts618: Projeto kernel-generic-6.18-lts-slackware-salix
EOF
          cat > "$PKGROOT/install/doinst.sh" <<EOF
#!/bin/sh
if [ -x /sbin/depmod ]; then
  /sbin/depmod ${RELEASE}
fi
exit 0
EOF
          chmod 0755 "$PKGROOT/install/doinst.sh"
          chmod 0644 \
            "$PKGROOT/boot/vmlinuz-${RELEASE}" \
            "$PKGROOT/boot/System.map-${RELEASE}" \
            "$PKGROOT/boot/config-${RELEASE}"
          find "$PKGROOT" -type d -exec chmod 0755 {} \;

      - name: Criar TXZ com makepkg nativo do Slackware
        run: |
          set -euo pipefail
          PKGROOT="$GITHUB_WORKSPACE/build/package-root"
          mkdir -p "$GITHUB_WORKSPACE/output"
          PACKAGE="$GITHUB_WORKSPACE/output/${PACKAGE_NAME}"
          cd "$PKGROOT"
          echo "makepkg usado: $(command -v makepkg)"
          makepkg -l y -c n "$PACKAGE"
          test -s "$PACKAGE"
          ls -lh "$PACKAGE"

      - name: Validar TXZ usando pkgtools do Slackware
        run: |
          set -euo pipefail
          PACKAGE="$GITHUB_WORKSPACE/output/${PACKAGE_NAME}"
          VERIFY="$GITHUB_WORKSPACE/build/verify-package"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"
          cd "$VERIFY"
          explodepkg "$PACKAGE"
          test -s "boot/vmlinuz-${KERNEL_VERSION}"
          test -s "boot/System.map-${KERNEL_VERSION}"
          test -s "boot/config-${KERNEL_VERSION}"
          test -d "lib/modules/${KERNEL_VERSION}"
          test -s "install/slack-desc"
          test -s "install/doinst.sh"
          echo "PACOTE SLACKWARE VALIDADO"
          file "boot/vmlinuz-${KERNEL_VERSION}"
          find "lib/modules/${KERNEL_VERSION}" -type f -name '*.ko' | wc -l

      - name: Gerar SHA256
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/output"
          sha256sum "$PACKAGE_NAME" > "${PACKAGE_NAME}.sha256"
          cat "${PACKAGE_NAME}.sha256"

      - name: Upload do pacote
        uses: actions/upload-artifact@v4
        with:
          name: kernel-slackware-${{ steps.version.outputs.kernel_version }}
          path: |
            output/${{ steps.version.outputs.package_name }}
            output/${{ steps.version.outputs.package_name }}.sha256
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publicar TXZ
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar pacote gerado no Slackware
        uses: actions/download-artifact@v4
        with:
          name: kernel-slackware-${{ needs.build.outputs.kernel_version }}
          path: release

      - name: Mostrar artefatos
        run: ls -lh release

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.kernel_version }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" \
              "release/$PACKAGE" \
              "release/$PACKAGE.sha256" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "release/$PACKAGE" \
              "release/$PACKAGE.sha256" \
              --title "Linux $VERSION para Slackware/Salix" \
              --notes "Kernel Linux $VERSION da série 6.18 LTS. Compilado e empacotado dentro de Slackware 15.0 usando o makepkg nativo do Slackware. Inclui kernel e módulos. XFS, Btrfs e Zstd incorporados ao kernel."
          fi
