name: Build Slackware Kernel 6.18 TXZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-kernel.yml"
      - ".github/scripts/build-kernel-slackware.sh"
      - ".github/scripts/build-kernel-headers-slackware.sh"
      - ".ci/LAST-SUCCESS.md"

permissions:
  contents: write

concurrency:
  group: kernel-6.18-slackware
  cancel-in-progress: true

env:
  JOBS: "2"
  SLACKWARE_IMAGE: "aclemons/slackware:15.0"

jobs:
  sync_release_package:
    name: Copiar três TXZ validados para o repositório
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[repo-package-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout da branch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ler última entrega validada
        id: meta
        shell: bash
        run: |
          set -euxo pipefail
          test -s .ci/LAST-SUCCESS.md

          VERSION="$(sed -n 's/^- Kernel: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          PACKAGE="$(sed -n 's/^- Pacote kernel: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          PACKAGE_SHA256="$(sed -n 's/^- SHA-256 kernel: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          DEVEL_PACKAGE="$(sed -n 's/^- Pacote devel: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          DEVEL_SHA256="$(sed -n 's/^- SHA-256 devel: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          HEADERS_PACKAGE="$(sed -n 's/^- Pacote headers: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          HEADERS_SHA256="$(sed -n 's/^- SHA-256 headers: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"
          TAG="$(sed -n 's/^- Tag: //p' .ci/LAST-SUCCESS.md | sed -n '1p')"

          for v in VERSION PACKAGE PACKAGE_SHA256 DEVEL_PACKAGE DEVEL_SHA256 HEADERS_PACKAGE HEADERS_SHA256 TAG; do
            test -n "${!v}"
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$PACKAGE_SHA256" >> "$GITHUB_OUTPUT"
          echo "devel_package=$DEVEL_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "devel_sha256=$DEVEL_SHA256" >> "$GITHUB_OUTPUT"
          echo "headers_package=$HEADERS_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "headers_sha256=$HEADERS_SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Baixar três pacotes publicados da Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          PACKAGE_SHA256: ${{ steps.meta.outputs.package_sha256 }}
          DEVEL_PACKAGE: ${{ steps.meta.outputs.devel_package }}
          DEVEL_SHA256: ${{ steps.meta.outputs.devel_sha256 }}
          HEADERS_PACKAGE: ${{ steps.meta.outputs.headers_package }}
          HEADERS_SHA256: ${{ steps.meta.outputs.headers_sha256 }}
        run: |
          set -euxo pipefail
          rm -rf repo-package-download
          mkdir -p repo-package-download

          for asset in \
            "$PACKAGE" "$PACKAGE.sha256" \
            "$DEVEL_PACKAGE" "$DEVEL_PACKAGE.sha256" \
            "$HEADERS_PACKAGE" "$HEADERS_PACKAGE.sha256"; do
            gh release download "$TAG" --pattern "$asset" --dir repo-package-download
            test -s "repo-package-download/$asset"
          done

          test "$(sha256sum "repo-package-download/$PACKAGE" | awk '{print $1}')" = "$PACKAGE_SHA256"
          test "$(sha256sum "repo-package-download/$DEVEL_PACKAGE" | awk '{print $1}')" = "$DEVEL_SHA256"
          test "$(sha256sum "repo-package-download/$HEADERS_PACKAGE" | awk '{print $1}')" = "$HEADERS_SHA256"

          (
            cd repo-package-download
            sha256sum -c "$PACKAGE.sha256"
            sha256sum -c "$DEVEL_PACKAGE.sha256"
            sha256sum -c "$HEADERS_PACKAGE.sha256"
          )

      - name: Commitar três TXZ dentro da branch main
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          PACKAGE_SHA256: ${{ steps.meta.outputs.package_sha256 }}
          DEVEL_PACKAGE: ${{ steps.meta.outputs.devel_package }}
          DEVEL_SHA256: ${{ steps.meta.outputs.devel_sha256 }}
          HEADERS_PACKAGE: ${{ steps.meta.outputs.headers_package }}
          HEADERS_SHA256: ${{ steps.meta.outputs.headers_sha256 }}
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main

          mkdir -p packages .ci
          for asset in \
            "$PACKAGE" "$PACKAGE.sha256" \
            "$DEVEL_PACKAGE" "$DEVEL_PACKAGE.sha256" \
            "$HEADERS_PACKAGE" "$HEADERS_PACKAGE.sha256"; do
            cp -f "repo-package-download/$asset" "packages/$asset"
          done

          test "$(sha256sum "packages/$PACKAGE" | awk '{print $1}')" = "$PACKAGE_SHA256"
          test "$(sha256sum "packages/$DEVEL_PACKAGE" | awk '{print $1}')" = "$DEVEL_SHA256"
          test "$(sha256sum "packages/$HEADERS_PACKAGE" | awk '{print $1}')" = "$HEADERS_SHA256"

          KERNEL_SIZE="$(stat -c '%s' "packages/$PACKAGE")"
          DEVEL_SIZE="$(stat -c '%s' "packages/$DEVEL_PACKAGE")"
          HEADERS_SIZE="$(stat -c '%s' "packages/$HEADERS_PACKAGE")"

          test "$KERNEL_SIZE" -lt 100000000
          test "$DEVEL_SIZE" -lt 100000000
          test "$HEADERS_SIZE" -lt 100000000

          cat > .ci/PACKAGE-IN-REPO.md <<EOF_PACKAGE
          # Pacotes TXZ armazenados no repositório

          - Kernel: $VERSION
          - Pacote kernel: packages/$PACKAGE
          - SHA-256 kernel: $PACKAGE_SHA256
          - Pacote devel: packages/$DEVEL_PACKAGE
          - SHA-256 devel: $DEVEL_SHA256
          - Pacote headers: packages/$HEADERS_PACKAGE
          - SHA-256 headers: $HEADERS_SHA256
          - Release de origem: $TAG
          - Workflow run: $GITHUB_RUN_ID
          - Estado: três pacotes validados e commitados na branch main
          EOF_PACKAGE

          git add \
            "packages/$PACKAGE" "packages/$PACKAGE.sha256" \
            "packages/$DEVEL_PACKAGE" "packages/$DEVEL_PACKAGE.sha256" \
            "packages/$HEADERS_PACKAGE" "packages/$HEADERS_PACKAGE.sha256" \
            .ci/PACKAGE-IN-REPO.md

          if git diff --cached --quiet; then
            echo "Os três pacotes já estão presentes e idênticos no repositório."
          else
            git commit -m "Adiciona TXZ kernel, devel e headers ao repositório"
            git push origin HEAD:main
          fi

          for asset in "$PACKAGE" "$DEVEL_PACKAGE" "$HEADERS_PACKAGE"; do
            SIZE_LOCAL="$(stat -c '%s' "packages/$asset")"
            SIZE_REMOTE="$(gh api "repos/$GITHUB_REPOSITORY/contents/packages/$asset?ref=main" --jq '.size')"
            test "$SIZE_LOCAL" = "$SIZE_REMOTE"
          done
          echo "Três pacotes confirmados na branch main."

  build:
    name: Compilar e empacotar no Slackware 15.0
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[repo-package-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      kernel_version: ${{ steps.meta.outputs.kernel_version }}
      package_name: ${{ steps.meta.outputs.package_name }}
      devel_package_name: ${{ steps.meta.outputs.devel_package_name }}
      headers_package_name: ${{ steps.meta.outputs.headers_package_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Liberar espaço no runner
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar execução atual
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci
          cat > .ci/CURRENT-RUN.md <<EOF_RUN
          # Execução atual do build

          - Run ID: $GITHUB_RUN_ID
          - Commit: $GITHUB_SHA
          - Tentativa: $GITHUB_RUN_ATTEMPT
          - Imagem: $SLACKWARE_IMAGE
          - Jobs: $JOBS
          - Estado inicial: iniciado
          EOF_RUN

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/CURRENT-RUN.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: registra execução atual do kernel"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Validar scripts de build
        shell: bash
        run: |
          set -euxo pipefail
          bash -n .github/scripts/build-kernel-slackware.sh
          bash -n .github/scripts/build-kernel-headers-slackware.sh
          chmod +x .github/scripts/build-kernel-slackware.sh
          chmod +x .github/scripts/build-kernel-headers-slackware.sh

      - name: Baixar imagem base Slackware 15.0
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform linux/amd64 "$SLACKWARE_IMAGE"
          docker image inspect "$SLACKWARE_IMAGE" >/dev/null
          test -s /etc/ssl/certs/ca-certificates.crt
          docker images "$SLACKWARE_IMAGE"
          df -h /

      - name: Validar bootstrap TLS no Slackware 15.0
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            -v /etc/ssl/certs/ca-certificates.crt:/bootstrap/ca-certificates.crt:ro \
            "$SLACKWARE_IMAGE" \
            /bin/bash -lc '
              set -e
              test -s /bootstrap/ca-certificates.crt
              wget --ca-certificate=/bootstrap/ca-certificates.crt \
                -q --spider \
                https://mirrors.kernel.org/slackware/slackware64-15.0/CHECKSUMS.md5.asc
              echo "Bootstrap TLS OK"
            '

      - name: Compilar kernel e criar kernel + kernel-devel
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf output .kernel-build
          mkdir -p output .kernel-build

          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            -e JOBS="$JOBS" \
            -e WORKROOT=/work \
            -e BUILDROOT=/work/.kernel-build \
            -e BOOTSTRAP_CA=/bootstrap/ca-certificates.crt \
            -v /etc/ssl/certs/ca-certificates.crt:/bootstrap/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$SLACKWARE_IMAGE" \
            /bin/bash /work/.github/scripts/build-kernel-slackware.sh

      - name: Criar kernel-headers TXZ no mesmo Slackware 15.0
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            -e WORKROOT=/work \
            -e BUILDROOT=/work/.kernel-build \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$SLACKWARE_IMAGE" \
            /bin/bash /work/.github/scripts/build-kernel-headers-slackware.sh

      - name: Registrar diagnóstico da falha de build
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          {
            echo "GitHub Actions - último diagnóstico de falha"
            echo "==========================================="
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "image=$SLACKWARE_IMAGE"
            echo "jobs=$JOBS"
            echo
            df -h /
            echo
            du -sh .kernel-build 2>/dev/null || true
            echo
            if [ -s output/build.log ]; then
              tail -n 3000 output/build.log
            else
              echo "output/build.log não foi criado."
            fi
          } > .ci/last-failure.log

          tail -n 300 .ci/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-failure.log
          if ! git diff --cached --quiet; then
            git commit -m "CI: registra última falha do build do kernel"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload do log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-log
          path: |
            output/build.log
            output/meta.env
            .ci/last-failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Ler metadados dos três pacotes
        id: meta
        shell: bash
        run: |
          set -euxo pipefail
          test -s output/meta.env
          source output/meta.env
          for v in KERNEL_VERSION PACKAGE_NAME DEVEL_PACKAGE_NAME HEADERS_PACKAGE_NAME RELEASE_TAG; do
            test -n "${!v}"
          done
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "devel_package_name=$DEVEL_PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "headers_package_name=$HEADERS_PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cat output/meta.env

      - name: Verificar artefatos locais
        shell: bash
        run: |
          set -euxo pipefail
          source output/meta.env
          for f in \
            "$PACKAGE_NAME" "$PACKAGE_NAME.sha256" \
            "$DEVEL_PACKAGE_NAME" "$DEVEL_PACKAGE_NAME.sha256" \
            "$HEADERS_PACKAGE_NAME" "$HEADERS_PACKAGE_NAME.sha256" \
            "config-$KERNEL_VERSION.final"; do
            test -s "output/$f"
          done
          (
            cd output
            sha256sum -c "$PACKAGE_NAME.sha256"
            sha256sum -c "$DEVEL_PACKAGE_NAME.sha256"
            sha256sum -c "$HEADERS_PACKAGE_NAME.sha256"
          )
          ls -lh output/
          df -h /

      - name: Upload dos três pacotes para Actions
        uses: actions/upload-artifact@v4
        with:
          name: kernel-slackware-${{ steps.meta.outputs.kernel_version }}
          path: |
            output/${{ steps.meta.outputs.package_name }}
            output/${{ steps.meta.outputs.package_name }}.sha256
            output/${{ steps.meta.outputs.devel_package_name }}
            output/${{ steps.meta.outputs.devel_package_name }}.sha256
            output/${{ steps.meta.outputs.headers_package_name }}
            output/${{ steps.meta.outputs.headers_package_name }}.sha256
            output/config-${{ steps.meta.outputs.kernel_version }}.final
            output/build.log
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar e verificar três TXZ
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout para registrar resultado
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Baixar pacotes do job de build
        uses: actions/download-artifact@v4
        with:
          name: kernel-slackware-${{ needs.build.outputs.kernel_version }}
          path: release

      - name: Verificar três pacotes antes da publicação
        shell: bash
        env:
          PACKAGE: ${{ needs.build.outputs.package_name }}
          DEVEL_PACKAGE: ${{ needs.build.outputs.devel_package_name }}
          HEADERS_PACKAGE: ${{ needs.build.outputs.headers_package_name }}
        run: |
          set -euxo pipefail
          for f in \
            "$PACKAGE" "$PACKAGE.sha256" \
            "$DEVEL_PACKAGE" "$DEVEL_PACKAGE.sha256" \
            "$HEADERS_PACKAGE" "$HEADERS_PACKAGE.sha256"; do
            test -s "release/$f"
          done
          (
            cd release
            sha256sum -c "$PACKAGE.sha256"
            sha256sum -c "$DEVEL_PACKAGE.sha256"
            sha256sum -c "$HEADERS_PACKAGE.sha256"
          )
          ls -lh release/

      - name: Publicar GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.kernel_version }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
          DEVEL_PACKAGE: ${{ needs.build.outputs.devel_package_name }}
          HEADERS_PACKAGE: ${{ needs.build.outputs.headers_package_name }}
        run: |
          set -euxo pipefail
          exec > >(tee -a release/publish.log) 2>&1

          ASSETS=(
            "release/$PACKAGE" "release/$PACKAGE.sha256"
            "release/$DEVEL_PACKAGE" "release/$DEVEL_PACKAGE.sha256"
            "release/$HEADERS_PACKAGE" "release/$HEADERS_PACKAGE.sha256"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create \
              "$TAG" \
              "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Linux $VERSION para Slackware/Salix" \
              --notes "Entrega nativa Slackware com três TXZ: kernel, kernel-devel e kernel-headers. Todos são produzidos dentro de Slackware 15.0 com makepkg. O kernel inclui suporte USB ampliado e rtw88_8821cu para 0bda:c820. O kernel-devel é validado compilando módulo externo. O kernel-headers é gerado com make headers_install e fornece UAPI headers em /usr/include."
          fi

          RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
          test -n "$RELEASE_URL"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE_URL"

      - name: Confirmar três pacotes publicados e checksums remotos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
          DEVEL_PACKAGE: ${{ needs.build.outputs.devel_package_name }}
          HEADERS_PACKAGE: ${{ needs.build.outputs.headers_package_name }}
        run: |
          set -euxo pipefail
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,assets,url \
            > release/release.json

          jq -e '.isDraft == false and .isPrerelease == false' release/release.json
          for asset in \
            "$PACKAGE" "$PACKAGE.sha256" \
            "$DEVEL_PACKAGE" "$DEVEL_PACKAGE.sha256" \
            "$HEADERS_PACKAGE" "$HEADERS_PACKAGE.sha256"; do
            jq -e --arg p "$asset" '.assets | map(.name) | index($p) != null' release/release.json
          done

          rm -rf release-verify
          mkdir -p release-verify
          for asset in \
            "$PACKAGE" "$PACKAGE.sha256" \
            "$DEVEL_PACKAGE" "$DEVEL_PACKAGE.sha256" \
            "$HEADERS_PACKAGE" "$HEADERS_PACKAGE.sha256"; do
            gh release download "$TAG" --pattern "$asset" --dir release-verify
          done

          (
            cd release-verify
            sha256sum -c "$PACKAGE.sha256"
            sha256sum -c "$DEVEL_PACKAGE.sha256"
            sha256sum -c "$HEADERS_PACKAGE.sha256"
          )
          cmp -s "release/$PACKAGE" "release-verify/$PACKAGE"
          cmp -s "release/$DEVEL_PACKAGE" "release-verify/$DEVEL_PACKAGE"
          cmp -s "release/$HEADERS_PACKAGE" "release-verify/$HEADERS_PACKAGE"
          echo "Três pacotes remotos confirmados byte a byte."

      - name: Registrar entrega concluída no repositório
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.kernel_version }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
          DEVEL_PACKAGE: ${{ needs.build.outputs.devel_package_name }}
          HEADERS_PACKAGE: ${{ needs.build.outputs.headers_package_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          set -euxo pipefail
          mkdir -p .ci
          PACKAGE_SHA256="$(awk '{print $1}' "release/$PACKAGE.sha256")"
          DEVEL_SHA256="$(awk '{print $1}' "release/$DEVEL_PACKAGE.sha256")"
          HEADERS_SHA256="$(awk '{print $1}' "release/$HEADERS_PACKAGE.sha256")"

          cat > .ci/LAST-SUCCESS.md <<EOF_SUCCESS
          # Última entrega TXZ concluída

          - Kernel: $VERSION
          - Pacote kernel: $PACKAGE
          - SHA-256 kernel: $PACKAGE_SHA256
          - Pacote devel: $DEVEL_PACKAGE
          - SHA-256 devel: $DEVEL_SHA256
          - Pacote headers: $HEADERS_PACKAGE
          - SHA-256 headers: $HEADERS_SHA256
          - Tag: $TAG
          - Release: $RELEASE_URL
          - Workflow run: $GITHUB_RUN_ID
          - Commit do workflow: $GITHUB_SHA
          - Ambiente de build: Slackware 15.0
          - Empacotamento: makepkg nativo do Slackware para os três pacotes
          - Validação kernel: installpkg --warn, explodepkg, módulos RTL8821CU e alias USB 0bda:c820
          - Validação devel: installpkg --warn, explodepkg e compilação de módulo externo com vermagic correspondente
          - Validação headers: make headers_install, installpkg --warn, explodepkg e compilação userspace de teste
          - Validação remota: SHA-256 e download da Release comparado byte a byte

          Instalação no Slackware/Salix:

          \`\`\`bash
          sudo installpkg $PACKAGE
          sudo installpkg $DEVEL_PACKAGE
          sudo upgradepkg --install-new $HEADERS_PACKAGE
          \`\`\`
          EOF_SUCCESS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/LAST-SUCCESS.md
          if ! git diff --cached --quiet; then
            git commit -m "[repo-package-only] CI: registra entrega dos três TXZ"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Registrar falha de publicação
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          {
            echo "GitHub Actions - falha na entrega/publicação"
            echo "=========================================="
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "package=${{ needs.build.outputs.package_name }}"
            echo "devel_package=${{ needs.build.outputs.devel_package_name }}"
            echo "headers_package=${{ needs.build.outputs.headers_package_name }}"
            echo "tag=${{ needs.build.outputs.release_tag }}"
            echo
            if [ -s release/publish.log ]; then
              cat release/publish.log
            fi
            echo
            ls -lh release 2>/dev/null || true
          } > .ci/last-publish-failure.log

          tail -n 300 .ci/last-publish-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-publish-failure.log
          if ! git diff --cached --quiet; then
            git commit -m "CI: registra falha na publicação dos três TXZ"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload do log de publicação em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-publish-failure-log
          path: |
            release/publish.log
            release/release.json
            .ci/last-publish-failure.log
          if-no-files-found: ignore
          retention-days: 7
