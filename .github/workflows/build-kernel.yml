name: Build Slackware Kernel 6.18 TXZ

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-kernel.yml"
      - ".github/scripts/build-kernel-slackware.sh"

permissions:
  contents: write

concurrency:
  group: kernel-6.18-slackware
  cancel-in-progress: true

env:
  JOBS: "2"
  SLACKWARE_IMAGE: "aclemons/slackware:15.0"

jobs:
  build:
    name: Compilar e empacotar no Slackware 15.0
    runs-on: ubuntu-latest
    timeout-minutes: 360

    outputs:
      kernel_version: ${{ steps.meta.outputs.kernel_version }}
      package_name: ${{ steps.meta.outputs.package_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Liberar espaço no runner
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Antes da limpeza ==="
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker system prune -af --volumes || true
          echo "=== Depois da limpeza ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar script de build
        shell: bash
        run: |
          set -euxo pipefail
          bash -n .github/scripts/build-kernel-slackware.sh
          chmod +x .github/scripts/build-kernel-slackware.sh

      - name: Baixar imagem base Slackware 15.0
        shell: bash
        run: |
          set -euxo pipefail
          docker pull --platform linux/amd64 "$SLACKWARE_IMAGE"
          docker image inspect "$SLACKWARE_IMAGE" >/dev/null
          test -s /etc/ssl/certs/ca-certificates.crt
          docker images "$SLACKWARE_IMAGE"
          df -h /

      - name: Validar bootstrap TLS no Slackware 15.0
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            -v /etc/ssl/certs/ca-certificates.crt:/bootstrap/ca-certificates.crt:ro \
            "$SLACKWARE_IMAGE" \
            /bin/bash -lc '
              set -e
              test -s /bootstrap/ca-certificates.crt
              wget --ca-certificate=/bootstrap/ca-certificates.crt \
                -q --spider \
                https://mirrors.kernel.org/slackware/slackware64-15.0/CHECKSUMS.md5.asc
              echo "Bootstrap TLS OK"
            '

      - name: Compilar kernel e criar pacote TXZ
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf output .kernel-build
          mkdir -p output .kernel-build

          docker run --rm \
            --platform linux/amd64 \
            --user 0:0 \
            -e JOBS="$JOBS" \
            -e WORKROOT=/work \
            -e BUILDROOT=/work/.kernel-build \
            -e BOOTSTRAP_CA=/bootstrap/ca-certificates.crt \
            -v /etc/ssl/certs/ca-certificates.crt:/bootstrap/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            "$SLACKWARE_IMAGE" \
            /bin/bash /work/.github/scripts/build-kernel-slackware.sh

      - name: Registrar diagnóstico da falha de build
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          {
            echo "GitHub Actions - último diagnóstico de falha"
            echo "==========================================="
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit=$GITHUB_SHA"
            echo "image=$SLACKWARE_IMAGE"
            echo "jobs=$JOBS"
            echo
            echo "Espaço em disco:"
            df -h /
            echo
            echo "Uso da árvore de build:"
            du -sh .kernel-build 2>/dev/null || true
            echo
            if [ -s output/build.log ]; then
              echo "Últimas 3000 linhas de output/build.log:"
              echo "-----------------------------------------"
              tail -n 3000 output/build.log
            else
              echo "output/build.log não foi criado."
            fi
          } > .ci/last-failure.log

          tail -n 300 .ci/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-failure.log
          if ! git diff --cached --quiet; then
            git commit -m "CI: registra última falha do build do kernel"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload do log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-log
          path: |
            output/build.log
            output/meta.env
            .ci/last-failure.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Ler metadados do pacote
        id: meta
        shell: bash
        run: |
          set -euxo pipefail
          test -s output/meta.env
          source output/meta.env
          test -n "$KERNEL_VERSION"
          test -n "$PACKAGE_NAME"
          test -n "$RELEASE_TAG"
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cat output/meta.env

      - name: Verificar artefatos locais
        shell: bash
        run: |
          set -euxo pipefail
          source output/meta.env
          test -s "output/$PACKAGE_NAME"
          test -s "output/$PACKAGE_NAME.sha256"
          test -s "output/config-$KERNEL_VERSION.final"
          (
            cd output
            sha256sum -c "$PACKAGE_NAME.sha256"
          )
          ls -lh output/
          df -h /

      - name: Upload do pacote para Actions
        uses: actions/upload-artifact@v4
        with:
          name: kernel-slackware-${{ steps.meta.outputs.kernel_version }}
          path: |
            output/${{ steps.meta.outputs.package_name }}
            output/${{ steps.meta.outputs.package_name }}.sha256
            output/config-${{ steps.meta.outputs.kernel_version }}.final
            output/build.log
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar e verificar TXZ
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout para registrar resultado
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Baixar pacote do job de build
        uses: actions/download-artifact@v4
        with:
          name: kernel-slackware-${{ needs.build.outputs.kernel_version }}
          path: release

      - name: Verificar pacote antes da publicação
        shell: bash
        env:
          PACKAGE: ${{ needs.build.outputs.package_name }}
        run: |
          set -euxo pipefail
          test -s "release/$PACKAGE"
          test -s "release/$PACKAGE.sha256"
          (
            cd release
            sha256sum -c "$PACKAGE.sha256"
          )
          ls -lh release/

      - name: Publicar GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.kernel_version }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
        run: |
          set -euxo pipefail
          exec > >(tee -a release/publish.log) 2>&1

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" \
              "release/$PACKAGE" \
              "release/$PACKAGE.sha256" \
              --clobber
          else
            gh release create \
              "$TAG" \
              "release/$PACKAGE" \
              "release/$PACKAGE.sha256" \
              --target "$GITHUB_SHA" \
              --title "Linux $VERSION para Slackware/Salix" \
              --notes "Pacote Slackware TXZ x86_64 compilado e empacotado dentro de Slackware 15.0. Criado com makepkg e validado com installpkg --warn e explodepkg. Inclui kernel e módulos correspondentes. XFS, Btrfs, SATA/AHCI, device-mapper e dm-crypt são built-in. Instalação: sudo installpkg $PACKAGE"
          fi

          RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
          test -n "$RELEASE_URL"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE_URL"

      - name: Confirmar pacote publicado e checksum remoto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release_tag }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
        run: |
          set -euxo pipefail

          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,assets,url \
            > release/release.json

          jq -e '.isDraft == false and .isPrerelease == false' release/release.json
          jq -e --arg p "$PACKAGE" '.assets | map(.name) | index($p) != null' release/release.json
          jq -e --arg p "$PACKAGE.sha256" '.assets | map(.name) | index($p) != null' release/release.json

          rm -rf release-verify
          mkdir -p release-verify
          gh release download "$TAG" --pattern "$PACKAGE" --dir release-verify
          cp "release/$PACKAGE.sha256" release-verify/
          (
            cd release-verify
            sha256sum -c "$PACKAGE.sha256"
          )

          test -s "release-verify/$PACKAGE"
          cmp -s "release/$PACKAGE" "release-verify/$PACKAGE"
          echo "Pacote remoto confirmado byte a byte."

      - name: Registrar entrega concluída no repositório
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.kernel_version }}
          PACKAGE: ${{ needs.build.outputs.package_name }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        run: |
          set -euxo pipefail
          mkdir -p .ci
          SHA256="$(awk '{print $1}' "release/$PACKAGE.sha256")"

          cat > .ci/LAST-SUCCESS.md <<EOF_SUCCESS
          # Última entrega TXZ concluída

          - Kernel: $VERSION
          - Pacote: $PACKAGE
          - SHA-256: $SHA256
          - Tag: $TAG
          - Release: $RELEASE_URL
          - Workflow run: $GITHUB_RUN_ID
          - Commit do workflow: $GITHUB_SHA
          - Ambiente de build: Slackware 15.0
          - Empacotamento: makepkg nativo do Slackware
          - Validação: installpkg --warn, explodepkg, SHA-256 e download da Release comparado byte a byte

          Instalação no Slackware/Salix:

          \`\`\`bash
          sudo installpkg $PACKAGE
          \`\`\`
          EOF_SUCCESS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/LAST-SUCCESS.md
          if ! git diff --cached --quiet; then
            git commit -m "CI: registra entrega TXZ concluída"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Registrar falha de publicação
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          {
            echo "GitHub Actions - falha na entrega/publicação"
            echo "=========================================="
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "package=${{ needs.build.outputs.package_name }}"
            echo "tag=${{ needs.build.outputs.release_tag }}"
            echo
            if [ -s release/publish.log ]; then
              cat release/publish.log
            fi
            echo
            ls -lh release 2>/dev/null || true
          } > .ci/last-publish-failure.log

          tail -n 300 .ci/last-publish-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/last-publish-failure.log
          if ! git diff --cached --quiet; then
            git commit -m "CI: registra falha na publicação do TXZ"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload do log de publicação em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-publish-failure-log
          path: |
            release/publish.log
            release/release.json
            .ci/last-publish-failure.log
          if-no-files-found: ignore
          retention-days: 7
